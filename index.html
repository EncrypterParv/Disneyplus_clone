<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="images/disney.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disney+ Clone</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Header -->
    <header class="header" id="header">
      <div class="header-left">
        <img src="images/disney.png" alt="Disney+ Logo" class="logo" id="logo" />
        <nav class="nav-desktop" id="nav-desktop">
          <!-- Populated by JS -->
        </nav>
        <nav class="nav-mobile" id="nav-mobile">
          <!-- Populated by JS (first 3 icons only) -->
        </nav>
        <div class="menu-toggle" id="menu-toggle">
          <!-- 3-dot icon, populated by JS -->
        </div>
        <div class="dropdown-menu hidden" id="dropdown-menu">
          <!-- Populated by JS (remaining items) -->
        </div>
      </div>
      <img
        src="https://img.freepik.com/premium-vector/person-with-blue-shirt-that-says-name-person_1029948-7040.jpg?semt=ais_hybrid&w=740&q=80"
        alt="User Avatar"
        class="avatar"
        id="user-avatar"
      />
    </header>

    <!-- Slider -->
    <section class="slider-section" id="slider-section">
      <button class="slider-btn slider-btn-left hidden-mobile" id="slider-left">&#10094;</button>
      <button class="slider-btn slider-btn-right hidden-mobile" id="slider-right">&#10095;</button>
      <div class="slider-track" id="slider-track">
        <!-- Populated by JS from TMDB API -->
      </div>
    </section>

    <!-- Production Houses -->
    <section class="production-section" id="production-section">
      <div class="production-card" id="prod-disney">
        <img src="images/disney.png" alt="Disney" class="production-logo" />
        <video src="videos/disney.mp4" autoplay loop muted class="production-video"></video>
      </div>
      <div class="production-card" id="prod-marvel">
        <img src="images/marvel.png" alt="Marvel" class="production-logo" />
        <video src="videos/marvel.mp4" autoplay loop muted class="production-video"></video>
      </div>
      <div class="production-card" id="prod-pixar">
        <img src="images/pixar.png" alt="Pixar" class="production-logo" />
        <video src="videos/pixar.mp4" autoplay loop muted class="production-video"></video>
      </div>
      <div class="production-card" id="prod-starwars">
        <img src="images/starwar.png" alt="Star Wars" class="production-logo" />
        <video src="videos/star-wars.mp4" autoplay loop muted class="production-video"></video>
      </div>
      <div class="production-card" id="prod-national">
        <img src="images/nationalG.png" alt="National Geographic" class="production-logo" />
        <video src="videos/national-geographic.mp4" autoplay loop muted class="production-video"></video>
      </div>
    </section>

    <script src="js/app.js"></script>
  </body>
</html>
